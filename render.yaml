services:
  - type: web
    name: rentmystyle
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python3 server.py
    envVars:
      - key: RMS_DB
        value: ./rentmystyle.db
      - key: UPLOAD_DIR
        value: ./uploads
      - key: RMS_NO_DEMO
        value: "1"
      - key: ADMIN_PASSWORD
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
